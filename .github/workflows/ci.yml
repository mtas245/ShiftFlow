name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify required AI-SDLC artefacts
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/PROJECT.md
          test -f docs/TASKS.md
          test -f docs/specs/UC-TEMPLATE.md
          test -f .github/copilot-instructions.md
          test -d skills
          test -d .devcontainer

      - name: Check whitespace errors
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check HEAD^ HEAD
          else
            git diff --check "$PUSH_BEFORE_SHA" "$CURRENT_SHA"
          fi

  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: shiftflow_test
          POSTGRES_USER: shiftflow_test_user
          POSTGRES_PASSWORD: shiftflow_test_only_password
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftflow_test_user -d shiftflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://shiftflow_test_user:shiftflow_test_only_password@127.0.0.1:5432/shiftflow_test
      SHIFTFLOW_TEST_DATABASE_URL: postgresql+psycopg://shiftflow_test_user:shiftflow_test_only_password@127.0.0.1:5432/shiftflow_test
      PUBLIC_ORIGIN: https://localhost
      POSTMARK_SERVER_TOKEN: ""
      EMAIL_FROM_ADDRESS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: environments/python/requirements-ci.lock

      - name: Install locked test dependencies
        run: python -m pip install -r environments/python/requirements-ci.lock

      - name: Run unit and PostgreSQL integration tests
        run: python -m pytest -m "not e2e" tests/unit tests/integration -q

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: shiftflow_test
          POSTGRES_USER: shiftflow_test_user
          POSTGRES_PASSWORD: shiftflow_test_only_password
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftflow_test_user -d shiftflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://shiftflow_test_user:shiftflow_test_only_password@127.0.0.1:5432/shiftflow_test
      SHIFTFLOW_TEST_DATABASE_URL: postgresql+psycopg://shiftflow_test_user:shiftflow_test_only_password@127.0.0.1:5432/shiftflow_test
      PUBLIC_ORIGIN: https://localhost
      POSTMARK_SERVER_TOKEN: ""
      EMAIL_FROM_ADDRESS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            environments/python/requirements-ci.lock
            environments/python/requirements-e2e.txt

      - name: Install locked E2E dependencies
        run: python -m pip install -r environments/python/requirements-e2e.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run real-app Playwright E2E
        run: python -m pytest -m e2e tests/integration/test_company_onboarding_e2e.py -q

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start isolated Docker runtime
        run: |
          docker compose --project-name shiftflow-ci --env-file .env.example -f compose.yml build app
          docker compose --project-name shiftflow-ci --env-file .env.example -f compose.yml up -d --build db dev-tls
          docker compose --project-name shiftflow-ci --env-file .env.example -f compose.yml run --rm app python -m alembic upgrade head
          docker compose --project-name shiftflow-ci --env-file .env.example -f compose.yml up -d app

      - name: Verify HTTPS readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' shiftflow-ci-app-1)"
            if [ "$status" = "healthy" ]; then
              curl --fail --silent --show-error --insecure https://localhost:8443/health
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose --project-name shiftflow-ci --env-file .env.example -f compose.yml logs
              exit 1
            fi
            sleep 2
          done
          docker compose --project-name shiftflow-ci --env-file .env.example -f compose.yml logs
          exit 1

      - name: Stop isolated Docker runtime
        if: always()
        run: docker compose --project-name shiftflow-ci --env-file .env.example -f compose.yml down --volumes
